name: Release complete package
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: systemstatus-plugin-release
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build verified combined package and publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(node -p "require('./plugin.manifest.json').version")" = "$version"
          tag="v$version"
          notes="docs/RELEASE_NOTES_$(echo "$version" | tr . _).md"
          test -f "$notes"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving its tag and assets."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists without a release; refusing to retag."
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          test "$sha" = "${{ github.event.workflow_run.head_sha }}"
          python scripts/build-release.py --output dist
          zip="SystemStatus-Plugin-v$version.zip"
          unzip -t "dist/$zip" >/dev/null
          if unzip -Z1 "dist/$zip" | grep -E '(^|/)(\.env|config\.json|node_modules|__pycache__|\.git|tests)(/|$)'; then
            echo "::error::Unexpected instance config, dependency or cache."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/plugin-release"
          unzip -q "dist/$zip" -d "$RUNNER_TEMP/plugin-release"
          root="$RUNNER_TEMP/plugin-release/SystemStatus-Plugin-v$version"
          test -f "$root/collector/collector.py"
          test -f "$root/collector/config.example.json"
          test -f "$root/collector/qqbot-system-status.service"
          node --check "$root/plugin/SystemStatus-Plugin/index.js"
          for file in "$root"/plugin/SystemStatus-Plugin/lib/*.mjs; do node --check "$file"; done
          python -m py_compile "$root/collector/collector.py"
          (cd dist && sha256sum -c SHA256SUMS.txt)
          gh release create "$tag" "dist/$zip" dist/SHA256SUMS.txt \
            --target "$sha" --title "SystemStatus-Plugin $tag" \
            --notes-file "$notes" --latest --repo "$GITHUB_REPOSITORY"
