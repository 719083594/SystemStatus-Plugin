# One-off synchronization of the published v3.0.0 release description with the committed notes.
name: Sync v3.0.0 Release Description
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-v3-release-notes-once.yml
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == '719083594/SystemStatus-Plugin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update published release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v3.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release edit v3.0.0 --notes-file docs/RELEASE_NOTES_3_0_0.md --repo "$GITHUB_REPOSITORY"
          gh release view v3.0.0 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease --jq '.'
