# Unit-only CI for v3; live Linux + Docker + TRSS integration remains a separate release gate.
name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Runtime versions
        run: |
          node --version
          python --version
      - name: Unit tests
        run: npm test
      - name: Python syntax check
        run: python -m py_compile collector/collector.py
